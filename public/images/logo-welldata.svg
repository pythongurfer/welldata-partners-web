<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 42" fill="none">
  <defs>
    <!-- Brand gradient: blue → cyan -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Horizontal gradient for waveform (fades in/out) -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="35%"  stop-color="#3B82F6"/>
      <stop offset="65%"  stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Subtle inner glow for the waveform peak -->
    <filter id="peakGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Hex background radial fill -->
    <radialGradient id="hexFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#3B82F6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.02"/>
    </radialGradient>
  </defs>

  <!-- ─── Icon mark: pointy-top hexagon centered at (21,21) r=19 ─── -->
  <!-- Vertices: top(21,2) ur(37.5,11.5) lr(37.5,30.5) bot(21,40) ll(4.5,30.5) ul(4.5,11.5) -->
  <path d="M21 2 L37.5 11.5 L37.5 30.5 L21 40 L4.5 30.5 L4.5 11.5 Z"
        fill="url(#hexFill)"
        stroke="url(#brandGrad)"
        stroke-width="1.4"
        stroke-linejoin="round"/>

  <!-- ─── EKG-style waveform / MCSA signal inside hex ─── -->
  <path d="M7 21 L13 21 L16 27 L18.5 12 L21.5 27 L24 21 L36 21"
        stroke="url(#waveGrad)"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- Peak accent dot -->
  <circle cx="18.5" cy="12" r="2" fill="url(#brandGrad)" filter="url(#peakGlow)"/>

  <!-- ─── Wordmark ─── -->
  <text x="44" y="23"
        font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, sans-serif"
        font-size="20"
        letter-spacing="-0.4">
    <tspan font-weight="300" fill="#94A3B8">Well</tspan><tspan font-weight="700" fill="#F1F5F9">Data</tspan>
  </text>

  <!-- ─── PARTNERS sub-label ─── -->
  <text x="45" y="36"
        font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, sans-serif"
        font-size="7.5"
        font-weight="600"
        fill="url(#brandGrad)"
        letter-spacing="4.8">PARTNERS</text>
</svg>
